<svg width="100%" viewBox="0 0 688 140" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>Praxezz warning cyberframe banner</title>
  <desc>A compact, symmetric black and white cyberframe banner with cornercut double borders, red hazard accent, hazard stripe edges, radar pings and terminal detailing</desc>
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&amp;display=swap');
    </style>
    <clipPath id="innerClip">
      <polygon points="32,14 656,14 674,32 674,104 656,122 32,122 14,104 14,32"/>
    </clipPath>
    <pattern id="hazard" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="10" height="10" fill="#fff"/>
      <rect width="5" height="10" fill="#000"/>
    </pattern>
    <pattern id="grid" width="18" height="18" patternUnits="userSpaceOnUse">
      <path d="M 18 0 L 0 0 0 18" fill="none" stroke="#fff" stroke-width="0.5" opacity="0.5"/>
    </pattern>
    <pattern id="crosses" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 20,18 L 20,22 M 18,20 L 22,20" fill="none" stroke="#fff" stroke-width="0.5" opacity="0.3"/>
    </pattern>
    <pattern id="diagLines" width="24" height="24" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="24" stroke="#E8231A" stroke-width="1.5"/>
    </pattern>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="2.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect x="2" y="2" width="684" height="136" fill="#000000"/>
  <rect x="2" y="2" width="684" height="136" fill="url(#grid)" opacity="0.04"/>
  <rect x="2" y="2" width="684" height="136" fill="url(#crosses)" opacity="0.7"/>
  <rect x="2" y="2" width="684" height="136" fill="url(#diagLines)" opacity="0.035">
    <animate attributeName="opacity" values="0.02;0.06;0.02" dur="5s" repeatCount="indefinite"/>
  </rect>

  <!-- Flowing Circuit Data Lines (Background Enhancement) -->
  <path d="M 120,140 L 120,110 L 150,80 L 260,80 L 280,60 L 280,0" fill="none" stroke="#E8231A" stroke-width="1" opacity="0.2" stroke-dasharray="4 12">
    <animate attributeName="stroke-dashoffset" from="150" to="0" dur="3s" repeatCount="indefinite"/>
  </path>
  <path d="M 520,140 L 520,90 L 490,60 L 400,60 L 380,40 L 380,0" fill="none" stroke="#fff" stroke-width="0.75" opacity="0.12" stroke-dasharray="5 15">
    <animate attributeName="stroke-dashoffset" from="0" to="200" dur="5s" repeatCount="indefinite"/>
  </path>
  <path d="M 220,140 L 220,115 L 235,100 L 420,100 L 450,70 L 450,0" fill="none" stroke="#00FF41" stroke-width="0.75" opacity="0.15" stroke-dasharray="2 8">
    <animate attributeName="stroke-dashoffset" from="200" to="0" dur="4s" repeatCount="indefinite"/>
  </path>

  <!-- Background numeric details -->
  <g opacity="0.07">
    <text x="560" y="105" font-family="'Courier New',monospace" font-size="45" fill="#E8231A">0</text>
    <polygon points="600,28 616,34 616,47 600,53 584,47 584,34" fill="none" stroke="#fff" stroke-width="1"/>
    <circle cx="250" cy="70" r="5" fill="#E8231A"/>
    <text x="200" y="45" font-family="'Courier New',monospace" font-size="10" fill="#fff">0x00FF88</text>
    <text x="480" y="120" font-family="'Courier New',monospace" font-size="8" fill="#E8231A">MEM: ADDR_3321</text>
  </g>

  <!-- Outer frame borders -->
  <polygon points="24,4 664,4 684,24 684,116 664,136 24,136 4,116 4,24" fill="none" stroke="#fff" stroke-width="3"/>
  <polygon points="32,14 656,14 674,32 674,104 656,122 32,122 14,104 14,32" fill="none" stroke="#fff" stroke-width="1"/>

  <!-- Corner Hazard Accents -->
  <polygon points="24,4 4,24 4,14 14,4" fill="#E8231A"/>
  <polygon points="664,4 684,24 684,14 674,4" fill="#E8231A"/>
  <polygon points="24,136 4,116 4,126 14,136" fill="#E8231A"/>
  <polygon points="664,136 684,116 684,126 674,136" fill="#E8231A"/>

  <!-- Hazard striping edges -->
  <rect x="60" y="0" width="80" height="4" fill="url(#hazard)"/>
  <rect x="540" y="0" width="80" height="4" fill="url(#hazard)"/>
  <rect x="60" y="136" width="80" height="4" fill="url(#hazard)"/>
  <rect x="540" y="136" width="80" height="4" fill="url(#hazard)"/>

  <!-- Inner clipped tech details -->
  <g clip-path="url(#innerClip)">
    <rect x="14" y="14" width="4" height="108" fill="#E8231A" opacity="0.36"/>
    <rect x="14" y="14" width="646" height="1.5" fill="#E8231A" opacity="0.09">
      <animate attributeName="y" values="16;120;16" dur="7s" repeatCount="indefinite"/>
    </rect>

    <text x="26" y="26" font-family="'Courier New',monospace" font-size="7" fill="#fff" opacity="0.25">01010000</text>
    <text x="612" y="104" font-family="'Courier New',monospace" font-size="7" fill="#fff" opacity="0.25">01011010</text>

    <!-- Edge wireframe nodes -->
    <path d="M 20 42 L 44 42 L 44 35" fill="none" stroke="#fff" stroke-width="0.75" opacity="0.4"/>
    <circle cx="44" cy="35" r="2" fill="#E8231A" opacity="0.7"/>
    <path d="M 660 91 L 636 91 L 636 98" fill="none" stroke="#fff" stroke-width="0.75" opacity="0.4"/>
    <circle cx="636" cy="98" r="2" fill="#E8231A" opacity="0.7"/>

    <path d="M 20 67 L 34 67" fill="none" stroke="#E8231A" stroke-width="0.75" opacity="0.5"/>
    <path d="M 660 67 L 646 67" fill="none" stroke="#E8231A" stroke-width="0.75" opacity="0.5"/>

    <text x="30" y="102" font-family="'Courier New',monospace" font-size="9" fill="#E8231A" opacity="0.5">&lt;/&gt;</text>
    <text x="622" y="32" font-family="'Courier New',monospace" font-size="9" fill="#E8231A" opacity="0.5">{ }</text>

    <circle cx="60" cy="84" r="1.2" fill="#fff" opacity="0.5"/>
    <circle cx="68" cy="84" r="1.2" fill="#fff" opacity="0.35"/>
    <circle cx="76" cy="84" r="1.2" fill="#fff" opacity="0.2"/>
    <circle cx="628" cy="49" r="1.2" fill="#fff" opacity="0.5"/>
    <circle cx="620" cy="49" r="1.2" fill="#fff" opacity="0.35"/>
    <circle cx="612" cy="49" r="1.2" fill="#fff" opacity="0.2"/>

    <!-- Micro barcode flourish left side -->
    <g opacity="0.4" fill="#fff" transform="translate(-250,0)">
      <rect x="318" y="106" width="1" height="8"/>
      <rect x="322" y="106" width="2" height="8"/>
      <rect x="327" y="106" width="1" height="8"/>
      <rect x="330" y="106" width="1.5" height="8"/>
      <rect x="335" y="106" width="1" height="8"/>
      <rect x="338" y="106" width="2" height="8"/>
      <rect x="343" y="106" width="1" height="8"/>
      <rect x="347" y="106" width="1.5" height="8"/>
      <rect x="352" y="106" width="1" height="8"/>
      <rect x="356" y="106" width="2" height="8"/>
      <rect x="361" y="106" width="1" height="8"/>
      <rect x="364" y="106" width="1.5" height="8"/>
    </g>

    <!-- Micro barcode flourish right side -->
    <g opacity="0.4" fill="#fff" transform="translate(195,0)">
      <rect x="318" y="106" width="1" height="8"/>
      <rect x="322" y="106" width="2" height="8"/>
      <rect x="327" y="106" width="1" height="8"/>
      <rect x="330" y="106" width="1.5" height="8"/>
      <rect x="335" y="106" width="1" height="8"/>
      <rect x="338" y="106" width="2" height="8"/>
      <rect x="343" y="106" width="1" height="8"/>
      <rect x="347" y="106" width="1.5" height="8"/>
      <rect x="352" y="106" width="1" height="8"/>
      <rect x="356" y="106" width="2" height="8"/>
      <rect x="361" y="106" width="1" height="8"/>
      <rect x="364" y="106" width="1.5" height="8"/>
    </g>
  </g>

  <!-- Corner mounting points -->
  <circle cx="34" cy="24" r="5" fill="none" stroke="#fff" stroke-width="1.3"/>
  <circle cx="34" cy="24" r="1.8" fill="#E8231A"/>
  <circle cx="646" cy="24" r="5" fill="none" stroke="#fff" stroke-width="1.3"/>
  <circle cx="646" cy="24" r="1.8" fill="#E8231A"/>
  <circle cx="34" cy="109" r="5" fill="none" stroke="#fff" stroke-width="1.3"/>
  <circle cx="34" cy="109" r="1.8" fill="#E8231A"/>
  <circle cx="646" cy="109" r="5" fill="none" stroke="#fff" stroke-width="1.3"/>
  <circle cx="646" cy="109" r="1.8" fill="#E8231A"/>

  <!-- Radar ping pulses (Enhanced dual ring) -->
  <circle cx="34" cy="24" r="6" fill="none" stroke="#E8231A" stroke-width="1" opacity="0.6">
    <animate attributeName="r" values="6;20" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.8;0" dur="3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="34" cy="24" r="6" fill="none" stroke="#E8231A" stroke-width="0.5" opacity="0.6">
    <animate attributeName="r" values="6;14" dur="3s" begin="0.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.6;0" dur="3s" begin="0.5s" repeatCount="indefinite"/>
  </circle>

  <circle cx="646" cy="109" r="6" fill="none" stroke="#E8231A" stroke-width="1" opacity="0.6">
    <animate attributeName="r" values="6;20" dur="3s" begin="1.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.8;0" dur="3s" begin="1.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="646" cy="109" r="6" fill="none" stroke="#E8231A" stroke-width="0.5" opacity="0.6">
    <animate attributeName="r" values="6;14" dur="3s" begin="2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.6;0" dur="3s" begin="2s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Left Side: System Status Indicators (Balancing Element) -->
  <text x="55" y="40" font-family="'Courier New',monospace" font-size="6" fill="#fff" opacity="0.5">SEC_OVERRIDE</text>
  <path d="M 50,43 L 47,43 L 47,46" fill="none" stroke="#fff" stroke-width="0.5" opacity="0.5"/>
  <path d="M 115,43 L 118,43 L 118,46" fill="none" stroke="#fff" stroke-width="0.5" opacity="0.5"/>
  <path d="M 50,83 L 47,83 L 47,80" fill="none" stroke="#fff" stroke-width="0.5" opacity="0.5"/>
  <path d="M 115,83 L 118,83 L 118,80" fill="none" stroke="#fff" stroke-width="0.5" opacity="0.5"/>
  
  <g transform="translate(55, 48)">
    <polygon points="0,0 12,0 16,4 12,8 0,8" fill="#E8231A" opacity="0.3"/>
    <polygon points="20,0 32,0 36,4 32,8 20,8" fill="#E8231A" opacity="0.6"/>
    <polygon points="40,0 52,0 56,4 52,8 40,8" fill="#fff" opacity="0.9"/>
    
    <polygon points="0,12 12,12 16,16 12,20 0,20" fill="#E8231A" opacity="0.8"/>
    <polygon points="20,12 32,12 36,16 32,20 20,20" fill="#fff" opacity="0.4"/>
    <polygon points="40,12 52,12 56,16 52,20 40,20" fill="#E8231A" opacity="0.2"/>
    
    <polygon points="0,24 12,24 16,28 12,32 0,32" fill="#E8231A" opacity="0.5"/>
    <polygon points="20,24 32,24 36,28 32,32 20,32" fill="#E8231A" opacity="0.5"/>
    <polygon points="40,24 52,24 56,28 52,32 40,32" fill="#E8231A" opacity="0.5"/>
    
    <polygon points="40,0 52,0 56,4 52,8 40,8" fill="#fff">
      <animate attributeName="opacity" values="0.2;1;0.2" dur="2s" repeatCount="indefinite"/>
    </polygon>
    <polygon points="20,12 32,12 36,16 32,20 20,20" fill="#fff">
      <animate attributeName="opacity" values="0.1;0.8;0.1" dur="1.5s" repeatCount="indefinite"/>
    </polygon>
  </g>

  <!-- Left Minimal Graphic (HUD Reticle) -->
  <g opacity="0.45">
    <!-- Outer faint circle -->
    <circle cx="145" cy="66" r="20" fill="none" stroke="#fff" stroke-width="0.5" stroke-dasharray="2 4"/>
    
    <!-- Central dot and angular brackets -->
    <circle cx="145" cy="66" r="1.5" fill="#E8231A"/>
    <path d="M 136,61 L 133,61 L 133,71 L 136,71" fill="none" stroke="#E8231A" stroke-width="0.75" opacity="0.8"/>
    <path d="M 154,61 L 157,61 L 157,71 L 154,71" fill="none" stroke="#E8231A" stroke-width="0.75" opacity="0.8"/>
    
    <!-- Spinning elements -->
    <g>
      <circle cx="145" cy="66" r="9" fill="none" stroke="#fff" stroke-width="1.2" stroke-dasharray="1 10"/>
      <animateTransform attributeName="transform" type="rotate" from="0 145 66" to="360 145 66" dur="8s" repeatCount="indefinite"/>
    </g>
    
    <g>
      <circle cx="145" cy="66" r="14" fill="none" stroke="#fff" stroke-width="0.5" stroke-dasharray="12 6 2 6"/>
      <animateTransform attributeName="transform" type="rotate" from="360 145 66" to="0 145 66" dur="12s" repeatCount="indefinite"/>
    </g>
    
    <!-- Minimal data labels next to it -->
    <text x="173" y="62" font-family="'Courier New',monospace" font-size="5" fill="#fff" opacity="0.6">POS: 145X</text>
    <text x="173" y="69" font-family="'Courier New',monospace" font-size="5" fill="#fff" opacity="0.6">SYNC: OK</text>
    <path d="M 169,59 L 171,59 L 171,69 L 169,69" fill="none" stroke="#fff" stroke-width="0.5" opacity="0.4"/>
    
    <!-- Faint connecting line down to the connection node -->
    <path d="M 145,86 L 145,92" fill="none" stroke="#E8231A" stroke-width="0.5" stroke-dasharray="1 2"/>
  </g>

  <!-- Left Side Connection Node -->
  <rect x="142.5" y="96" width="5" height="3" fill="#E8231A" opacity="0.9"/>
  <path d="M 136,95 L 133,97.5 L 136,100" fill="none" stroke="#fff" stroke-width="1.2" opacity="0.7"/>
  <path d="M 154,95 L 157,97.5 L 154,100" fill="none" stroke="#fff" stroke-width="1.2" opacity="0.7"/>

  <!-- Left Side: Underline connecting to text -->
  <path d="M 220,97.5 L 157,97.5" fill="none" stroke="#fff" stroke-width="1" opacity="0.75"/>
  <rect x="165" y="97.5" width="45" height="1" fill="#E8231A"/>
  <circle cx="220" cy="97.5" r="1.5" fill="#fff"/>

  <!-- Top Center Uplink Status -->
  <text x="344" y="34" text-anchor="middle" font-family="'Orbitron','Courier New',monospace" font-weight="700" font-size="9.5" letter-spacing="6" fill="#E8231A" filter="url(#glow)">// SECURE UPLINK ESTABLISHED //
    <animate attributeName="opacity" values="0.9;0.5;0.9" dur="3s" repeatCount="indefinite"/>
  </text>

  <!-- Center: Praxezz Identity Logo -->
  <text x="345.6" y="81" text-anchor="middle" font-family="'Orbitron', 'Courier New', monospace" font-weight="700" font-size="42" fill="#E8231A" opacity="0.55" filter="url(#glow)" letter-spacing="2">PRAXEZZ</text>
  <text x="344" y="79" text-anchor="middle" font-family="'Orbitron', 'Courier New', monospace" font-weight="700" font-size="42" fill="#fff" letter-spacing="2">PRAXEZZ</text>
  
  <!-- Center: Identity Readout -->
  <text x="344" y="112" text-anchor="middle" font-family="'Orbitron','Courier New',monospace" font-size="8.5" letter-spacing="1" fill="#fff" opacity="0.65">IDENTITY: <tspan fill="#00FF41" opacity="1" filter="url(#glow)">AUTHENTICATED<animate attributeName="opacity" values="1;0.6;1" dur="2s" repeatCount="indefinite"/></tspan></text>

  <!-- Right Side: Animated Data Transfer Bars -->
  <text x="605" y="40" font-family="'Courier New',monospace" font-size="6" fill="#fff" opacity="0.5">NET.ACTV</text>
  <g transform="translate(605, 45)">
    <rect x="0" y="0" width="6" height="30" fill="#fff" opacity="0.1"/>
    <rect x="0" y="20" width="6" height="10" fill="#E8231A">
       <animate attributeName="y" values="20;10;25;5;20" dur="2s" repeatCount="indefinite"/>
       <animate attributeName="height" values="10;20;5;25;10" dur="2s" repeatCount="indefinite"/>
    </rect>
    <rect x="10" y="0" width="6" height="30" fill="#fff" opacity="0.1"/>
    <rect x="10" y="10" width="6" height="20" fill="#E8231A">
       <animate attributeName="y" values="10;5;15;10;10" dur="1.5s" repeatCount="indefinite"/>
       <animate attributeName="height" values="20;25;15;20;20" dur="1.5s" repeatCount="indefinite"/>
    </rect>
    <rect x="20" y="0" width="6" height="30" fill="#fff" opacity="0.1"/>
    <rect x="20" y="15" width="6" height="15" fill="#E8231A">
       <animate attributeName="y" values="15;25;10;20;15" dur="2.5s" repeatCount="indefinite"/>
       <animate attributeName="height" values="15;5;20;10;15" dur="2.5s" repeatCount="indefinite"/>
    </rect>
    <rect x="30" y="0" width="6" height="30" fill="#fff" opacity="0.1"/>
    <rect x="30" y="8" width="6" height="22" fill="#E8231A">
       <animate attributeName="y" values="8;18;5;12;8" dur="1.8s" repeatCount="indefinite"/>
       <animate attributeName="height" values="22;12;25;18;22" dur="1.8s" repeatCount="indefinite"/>
    </rect>
  </g>
  
  <!-- Right Side: Target Reticle Line -->
  <path d="M 468,97.5 L 600,97.5 L 610,87.5 L 630,87.5" fill="none" stroke="#fff" stroke-width="1" opacity="0.75"/>
  <rect x="530" y="97.5" width="50" height="1" fill="#E8231A"/>
  <circle cx="468" cy="97.5" r="1.5" fill="#fff"/>
  
  <circle cx="630" cy="88" r="2" fill="#E8231A"/>
  <circle cx="630" cy="88" r="4" fill="none" stroke="#E8231A" stroke-width="0.5"/>
  <circle cx="630" cy="88" r="6" fill="none" stroke="#fff" stroke-width="0.5" opacity="0.3"/>
  
</svg>