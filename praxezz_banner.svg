<svg width="100%" viewBox="0 0 688 200" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>Praxezz warning cyberframe banner</title>
  <desc>A symmetric, heavy black and white cyberframe banner with cornercut double borders, red hazard accent, hazard stripe edges and terminal detailing</desc>
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=UnifrakturMaguntia&amp;display=swap');
      .old-english { font-family: 'UnifrakturMaguntia', 'Old English Text MT', serif; }
    </style>
    <clipPath id="innerClip">
      <polygon points="34,14 646,14 666,34 666,156 646,176 34,176 14,156 14,34"/>
    </clipPath>
    <pattern id="hazard" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="10" height="10" fill="#fff"/>
      <rect width="5" height="10" fill="#000"/>
    </pattern>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#fff" stroke-width="0.5" opacity="0.5"/>
    </pattern>
    <pattern id="diagLines" width="24" height="24" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="24" stroke="#E8231A" stroke-width="1.5"/>
    </pattern>
    <filter id="redGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="2.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect x="2" y="2" width="676" height="186" fill="#000000"/>
  <rect x="2" y="2" width="676" height="186" fill="url(#diagLines)" opacity="0.035">
    <animate attributeName="opacity" values="0.02;0.06;0.02" dur="5s" repeatCount="indefinite"/>
  </rect>

  <g opacity="0.07">
    <text x="560" y="150" font-family="'Courier New',monospace" font-size="64" fill="#E8231A">0</text>
    <polygon points="600,40 616,49 616,67 600,76 584,67 584,49" fill="none" stroke="#fff" stroke-width="1"/>
    <circle cx="250" cy="100" r="6" fill="#E8231A"/>
  </g>

  <polygon points="26,4 654,4 676,26 676,164 654,186 26,186 4,164 4,26" fill="none" stroke="#fff" stroke-width="3"/>
  <polygon points="34,14 646,14 666,34 666,156 646,176 34,176 14,156 14,34" fill="none" stroke="#fff" stroke-width="1"/>

  <polygon points="26,4 4,26 4,14 14,4" fill="#E8231A"/>
  <polygon points="654,4 676,26 676,14 666,4" fill="#E8231A"/>
  <polygon points="26,186 4,164 4,176 14,186" fill="#E8231A"/>
  <polygon points="654,186 676,164 676,176 666,186" fill="#E8231A"/>

  <rect x="60" y="0" width="80" height="4" fill="url(#hazard)"/>
  <rect x="540" y="0" width="80" height="4" fill="url(#hazard)"/>
  <rect x="60" y="186" width="80" height="4" fill="url(#hazard)"/>
  <rect x="540" y="186" width="80" height="4" fill="url(#hazard)"/>

  <g clip-path="url(#innerClip)">
    <rect x="14" y="14" width="4" height="162" fill="#E8231A" opacity="0.36"/>
    <rect x="14" y="14" width="632" height="1.5" fill="#E8231A" opacity="0.09">
      <animate attributeName="y" values="16;174;16" dur="7s" repeatCount="indefinite"/>
    </rect>

    <text x="26" y="26" font-family="'Courier New',monospace" font-size="7" fill="#fff" opacity="0.25">01010000</text>
    <text x="612" y="168" font-family="'Courier New',monospace" font-size="7" fill="#fff" opacity="0.25">01011010</text>

    <path d="M 20 60 L 44 60 L 44 50" fill="none" stroke="#fff" stroke-width="0.75" opacity="0.4"/>
    <circle cx="44" cy="50" r="2" fill="#E8231A" opacity="0.7"/>
    <path d="M 660 130 L 636 130 L 636 140" fill="none" stroke="#fff" stroke-width="0.75" opacity="0.4"/>
    <circle cx="636" cy="140" r="2" fill="#E8231A" opacity="0.7"/>

    <path d="M 20 96 L 34 96" fill="none" stroke="#E8231A" stroke-width="0.75" opacity="0.5"/>
    <path d="M 660 96 L 646 96" fill="none" stroke="#E8231A" stroke-width="0.75" opacity="0.5"/>

    <text x="30" y="145" font-family="'Courier New',monospace" font-size="9" fill="#E8231A" opacity="0.5">&lt;/&gt;</text>
    <text x="622" y="46" font-family="'Courier New',monospace" font-size="9" fill="#E8231A" opacity="0.5">{ }</text>

    <circle cx="60" cy="120" r="1.2" fill="#fff" opacity="0.5"/>
    <circle cx="68" cy="120" r="1.2" fill="#fff" opacity="0.35"/>
    <circle cx="76" cy="120" r="1.2" fill="#fff" opacity="0.2"/>
    <circle cx="628" cy="70" r="1.2" fill="#fff" opacity="0.5"/>
    <circle cx="620" cy="70" r="1.2" fill="#fff" opacity="0.35"/>
    <circle cx="612" cy="70" r="1.2" fill="#fff" opacity="0.2"/>
  </g>

  <circle cx="34" cy="34" r="6" fill="none" stroke="#fff" stroke-width="1.3"/>
  <circle cx="34" cy="34" r="2" fill="#E8231A"/>
  <circle cx="646" cy="34" r="6" fill="none" stroke="#fff" stroke-width="1.3"/>
  <circle cx="646" cy="34" r="2" fill="#E8231A"/>
  <circle cx="34" cy="156" r="6" fill="none" stroke="#fff" stroke-width="1.3"/>
  <circle cx="34" cy="156" r="2" fill="#E8231A"/>
  <circle cx="646" cy="156" r="6" fill="none" stroke="#fff" stroke-width="1.3"/>
  <circle cx="646" cy="156" r="2" fill="#E8231A"/>

  <circle cx="646" cy="34" r="10" fill="none" stroke="#E8231A" stroke-width="0.8" opacity="0.6"/>

  <!-- LIFTED: y from 60 → 48 -->
  <text x="340" y="48" text-anchor="middle" font-family="'Orbitron','Courier New',monospace" font-weight="700" font-size="10.5" letter-spacing="6" fill="#E8231A" filter="url(#redGlow)">// SECURE UPLINK ESTABLISHED //
    <animate attributeName="opacity" values="0.9;0.4;0.9" dur="2.6s" repeatCount="indefinite"/>
  </text>

  <text x="341.6" y="118" text-anchor="middle" class="old-english" font-size="64" fill="#E8231A" opacity="0.55" filter="url(#redGlow)">Praxezz</text>
  <text x="340" y="116" text-anchor="middle" class="old-english" font-size="64" fill="#fff">Praxezz</text>

  <line x1="220" y1="140" x2="460" y2="140" stroke="#fff" stroke-width="1"/>
  <rect x="220" y="140" width="50" height="1" fill="#E8231A"/>

  <text x="340" y="160" text-anchor="middle" font-family="'Orbitron','Courier New',monospace" font-size="9.5" letter-spacing="1" fill="#fff" opacity="0.65">IDENTITY: <tspan fill="#E8231A" opacity="1" filter="url(#redGlow)">AUTHENTICATED<animate attributeName="opacity" values="1;0.5;1" dur="1.8s" repeatCount="indefinite"/></tspan> // SALUTATIONS, USER</text>
</svg>
